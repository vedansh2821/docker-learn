name: Docker CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build-and-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build web image
        run: docker build --tag docker-learn:latest .

      - name: Scan image for known vulnerabilities
        uses: aquasecurity/trivy-action@0.31.0
        with:
          image-ref: docker-learn:latest
          format: table
          exit-code: 0
          severity: CRITICAL,HIGH